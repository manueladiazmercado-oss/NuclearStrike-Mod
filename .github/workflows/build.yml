name: Build NuclearStrike Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract mod source archive
        run: |
          test -f nuclearstrike-mod-github-ready.zip
          unzip -q nuclearstrike-mod-github-ready.zip

      - name: Build mod
        working-directory: nuclearstrike
        run: gradle --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: NuclearStrike-Mod-JAR
          path: nuclearstrike/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
